{% extends 'base.html' %}

{% block title %}
 | Sign in
{% endblock %}

{% block content %}
  {% include 'partials/_alerts.html' %}

  <section id="login" class="auth-section">
    <div class="container">
      <div class="auth-card">
        <div class="auth-card__head">
          <span class="auth-card__icon"><i class="far fa-user"></i></span>
          <h1 class="auth-card__title">Sign in</h1>
          <p class="auth-card__lead">Access your account to track your project inquiries.</p>
        </div>

        <form action="{% url 'accounts:login' %}" method="post" class="auth-form" novalidate>
          {% csrf_token %}
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control"
                   autocomplete="username" autofocus required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   autocomplete="current-password" minlength="6" required>
          </div>

          <button type="submit" class="btn-quote auth-submit">Sign in</button>
        </form>

        <p class="auth-switch">
          New here? <a href="{% url 'accounts:register' %}">Create an account</a>
        </p>
      </div>
    </div>
  </section>
{% endblock %}
