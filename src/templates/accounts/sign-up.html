{% extends 'base.html' %}

{% block title %}
 | Create account
{% endblock %}

{% block content %}
  {% include 'partials/_alerts.html' %}

  <section id="register" class="auth-section">
    <div class="container">
      <div class="auth-card auth-card--wide">
        <div class="auth-card__head">
          <span class="auth-card__icon"><i class="fas fa-user-plus"></i></span>
          <h1 class="auth-card__title">Create an account</h1>
          <p class="auth-card__lead">Keep every inquiry and project update in one place.</p>
        </div>

        <form action="{% url 'accounts:register' %}" method="post" class="auth-form" novalidate>
          {% csrf_token %}

          <div class="auth-form__row">
            <div class="form-group">
              <label for="first_name">First name</label>
              <input type="text" id="first_name" name="first_name" class="form-control" autocomplete="given-name" required>
            </div>
            <div class="form-group">
              <label for="last_name">Last name</label>
              <input type="text" id="last_name" name="last_name" class="form-control" autocomplete="family-name" required>
            </div>
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" autocomplete="username" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
          </div>

          <div class="auth-form__row">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
              <label for="password2">Confirm password</label>
              <input type="password" id="password2" name="password2" class="form-control" autocomplete="new-password" minlength="8" required>
            </div>
          </div>

          <button type="submit" class="btn-quote auth-submit">Create account</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="{% url 'accounts:login' %}">Sign in</a>
        </p>
      </div>
    </div>
  </section>
{% endblock %}
