<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f4; font-family: Arial, sans-serif; color: #333; }
    .wrapper { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 6px; overflow: hidden; }
    .header { background: #10284e; padding: 32px 40px; }
    .header h1 { margin: 0; color: #ffffff; font-size: 22px; font-weight: 600; }
    .body { padding: 36px 40px; }
    .body p { line-height: 1.7; margin: 0 0 16px; }
    .detail-box { background: #f8f9fa; border-left: 4px solid #30caa0; border-radius: 4px; padding: 20px 24px; margin: 24px 0; }
    .detail-box p { margin: 6px 0; font-size: 14px; }
    .detail-box strong { display: inline-block; width: 90px; color: #555; }
    .footer { background: #f4f4f4; padding: 24px 40px; text-align: center; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>{{ site_name }}</h1>
    </div>
    <div class="body">
      <p>{{ intro }}</p>
      <div class="detail-box">
        <p><strong>Project:</strong> {{ project }}</p>
        <p><strong>Name:</strong> {{ name }}</p>
        <p><strong>Email:</strong> {{ email }}</p>
        <p><strong>Phone:</strong> {{ phone }}</p>
        {% if message %}
        <p><strong>Message:</strong></p>{{ message|safe }}
        {% endif %}
      </div>
      <p>Our team will review your inquiry and contact you as soon as possible.</p>
    </div>
    <div class="footer">
      &copy; {{ site_name }}. All rights reserved.
    </div>
  </div>
</body>
</html>
