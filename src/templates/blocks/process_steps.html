<!-- Process Steps -->
<section class="py-5 bg-light">
  <div class="container">
    {% if value.heading %}
      <h2 class="text-center text-primary mb-5">{{ value.heading }}</h2>
    {% endif %}
    <div class="row">
      {% for step in value.steps %}
        <div class="col-md-6 col-lg-3 mb-4 text-center">
          <div class="process-step-number">{{ step.step_number }}</div>
          <h5 class="text-primary">{{ step.title }}</h5>
          <p class="text-muted">{{ step.body }}</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
