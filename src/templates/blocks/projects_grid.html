
<section id="service-projects" class="py-5">
  <div class="container">
    {% if value.heading %}
      <h2 class="text-center mb-4">{{ value.heading }}</h2>
    {% endif %}

    {% if projects %}
      <div class="row reveal-group">
        {% for project in projects %}
          <div class="col-md-6 col-lg-4 mb-4 d-flex reveal">
            {% include 'partials/_project_card.html' with project=project %}
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-center text-muted py-4">{{ value.empty_message }}</p>
    {% endif %}
  </div>
</section>
