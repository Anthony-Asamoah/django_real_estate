<!-- Hero -->
<section id="showcase">
  <div class="d-flex align-items-center justify-content-center hero-inner-wrap" style="flex-direction:column;position:relative;">
    <div class="text-center text-white mb-4" style="position:relative;z-index:2;">
      <h1 class="display-4 fw-bold hero-animate hero-animate-1">{{ value.heading }}</h1>
      {% if value.subtext %}
        <p class="lead mb-0 hero-animate hero-animate-2">{{ value.subtext }}</p>
      {% endif %}
    </div>

    <!-- Floating filter card -->
    <div class="container hero-animate hero-animate-3" style="position:relative;z-index:2;">
      <div class="hero-filter-card mx-auto">
        <form method="get" action="{% url 'projects:projects' %}">
          <div class="hero-filter-fields">

            <div class="hero-filter-field">
              <label class="hero-filter-label">Keyword</label>
              <div class="hero-filter-input-wrap">
                <i class="fas fa-search hero-filter-icon"></i>
                <input type="text" name="q" class="hero-filter-input" placeholder="Search projects…">
              </div>
            </div>

            <div class="hero-filter-divider"></div>

            <div class="hero-filter-field">
              <label class="hero-filter-label">Service</label>
              <div class="hero-filter-input-wrap">
                <i class="fas fa-tools hero-filter-icon"></i>
                <select name="service" class="hero-filter-select">
                  <option value="">All Services</option>
                  {% for svc in service_pages %}
                    <option value="{{ svc.id }}">{{ svc.title }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="hero-filter-divider"></div>

            <div class="hero-filter-field">
              <label class="hero-filter-label">Status</label>
              <div class="hero-filter-input-wrap">
                <i class="fas fa-filter hero-filter-icon"></i>
                <select name="status" class="hero-filter-select">
                  <option value="all">All Projects</option>
                  <option value="past">Past Works</option>
                  <option value="active">Active</option>
                  <option value="completed">Completed</option>
                  <option value="in_progress">In Progress</option>
                </select>
              </div>
            </div>

            <button type="submit" class="hero-filter-btn">
              <i class="fas fa-search"></i>
              <span>Explore</span>
            </button>

          </div>
        </form>
      </div>
    </div>
  </div>
</section>
