{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something went wrong</title>
  <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}">
  <style>
    /* Self-contained: the 500 handler renders with an empty context,
       so brand colors are hardcoded to the project defaults here. */
    :root {
      --brand-primary: #10284e;
      --brand-secondary: #30caa0;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      background: #f0f3f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a2540;
    }

    .error-card {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 620px;
      background: #fff;
      border-radius: 18px;
      padding: 3.5rem 3rem 3.75rem;
      text-align: center;
      box-shadow: 0 12px 48px rgba(16, 40, 78, 0.13);
    }

    .error-code {
      font-size: clamp(4.5rem, 14vw, 7.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--brand-primary);
      opacity: 0.12;
      margin-bottom: -0.35rem;
    }

    .error-eyebrow {
      display: inline-block;
      color: var(--brand-secondary);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .error-title {
      color: var(--brand-primary);
      font-size: clamp(1.5rem, 3.5vw, 2.1rem);
      font-weight: 800;
      margin: 0 0 0.9rem;
      line-height: 1.2;
    }

    .error-text {
      color: #4a5568;
      font-size: 0.98rem;
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto 2rem;
    }

    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.82rem 1.6rem;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: filter 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .error-btn svg {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    .error-btn-primary {
      background: var(--brand-primary);
      color: #fff;
      border: 1.5px solid var(--brand-primary);
    }

    .error-btn-primary:hover {
      filter: brightness(1.14);
    }

    .error-btn-secondary {
      background: transparent;
      color: var(--brand-primary);
      border: 1.5px solid #dde3ec;
    }

    .error-btn-secondary:hover {
      border-color: var(--brand-secondary);
      color: var(--brand-secondary);
    }

    .error-deco {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .error-deco-1 {
      bottom: -80px;
      right: -80px;
      width: 220px;
      height: 220px;
      border: 50px solid rgba(16, 40, 78, 0.04);
    }

    .error-deco-2 {
      top: -40px;
      left: -30px;
      width: 140px;
      height: 140px;
      border: 30px solid rgba(48, 202, 160, 0.07);
    }

    @media (max-width: 640px) {
      .error-card {
        padding: 2.75rem 1.5rem 3rem;
      }
    }
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-code" aria-hidden="true">500</div>
    <span class="error-eyebrow">Server Error</span>
    <h1 class="error-title">Something went wrong</h1>
    <p class="error-text">
      We hit an unexpected problem on our end. This is usually temporary —
      try again in a moment, or head back to the homepage.
    </p>
    <div class="error-actions">
      <button type="button" class="error-btn error-btn-primary" onclick="window.location.reload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <span>Try Again</span>
      </button>
      <a href="/" class="error-btn error-btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Back to Home</span>
      </a>
    </div>

    <span class="error-deco error-deco-1" aria-hidden="true"></span>
    <span class="error-deco error-deco-2" aria-hidden="true"></span>
  </main>
</body>
</html>
